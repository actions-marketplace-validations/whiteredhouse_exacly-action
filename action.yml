# Exacly for other repositories' workflows: `uses: whiteredhouse/exacly-action@v0`.
# Installs the exacly release pinned in pyproject.toml, from uv.lock.
name: Exacly
description: Validate an Exacly model, or comment a pull request's change plan.
author: whiteredhouse
branding:
  icon: check-square
  color: blue

inputs:
  mode:
    description: >-
      check: validate the model and fail when it doesn't conform. plan: write the change plan against the pull
      request's base branch to the job summary and, for pull requests from the same repository, as a comment
      that each run replaces (needs pull-requests: write).
    default: check
  model:
    description: >-
      The model's config and state, as files, folders or patterns such as spec/exacly/*.yaml, one per line or
      separated by spaces.
    default: spec/exacly
  base:
    description: "plan: the branch the change is against. Default: the pull request's base branch."
    default: ""
  token:
    description: >-
      plan: the token that comments. It needs pull-requests: write. The earlier comment is found as
      github-actions[bot]'s, so with another token each run adds a comment.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.11.32"
        enable-cache: false

    - name: Install exacly
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
      run: 'source "$ACTION_PATH/scripts/install.sh"'

    - name: Validate the model
      if: inputs.mode == 'check'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODEL: ${{ inputs.model }}
      run: 'source "$ACTION_PATH/scripts/validate.sh"'

    - name: Write the plan
      if: inputs.mode == 'plan'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODEL: ${{ inputs.model }}
        BASE: ${{ inputs.base || github.base_ref }}
      run: 'source "$ACTION_PATH/scripts/plan.sh"'

    - name: Comment the plan, replacing the earlier one
      # A pull request from a fork gets a read-only token, so the plan stays in the job summary.
      if: >-
        inputs.mode == 'plan' && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ github.event.pull_request.number }}
      run: 'source "$ACTION_PATH/scripts/comment.sh"'
