name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Test, lint and type-check
        run: mise run check

  action:
    # The whole action, uv setup included, as another repository runs it, on each runner OS it supports.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare a separate consumer model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exacly-consumer"
          cp -R tests/model "$RUNNER_TEMP/exacly-consumer/model"
          cp tests/verification.json "$RUNNER_TEMP/exacly-consumer/model/verification.json"
          cp tests/policy.yaml tests/target.json "$RUNNER_TEMP/exacly-consumer/"
          printf 'name: delivery-required\nversion: "1"\nrequirements:\n  - record: REQ-001\n    dimensions: [delivery]\n' > "$RUNNER_TEMP/exacly-consumer/blocked-policy.yaml"
          printf 'exacly: 0.2.0\nrecords: [{id: OUT-001}]\n' > "$RUNNER_TEMP/exacly-consumer/invalid.yaml"
      - name: Validate the consumer model
        uses: ./
        with:
          model: ${{ runner.temp }}/exacly-consumer/model
      - name: Reject an invalid consumer model
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          model: ${{ runner.temp }}/exacly-consumer/invalid.yaml
      - name: Verify that invalid input failed
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          grep -F "Result: does not conform" "$RUNNER_TEMP/exacly-report.txt"

      - name: Accept satisfied readiness
        uses: ./
        with:
          mode: gate
          model: ${{ runner.temp }}/exacly-consumer/model
          policy: ${{ runner.temp }}/exacly-consumer/policy.yaml
          target: ${{ runner.temp }}/exacly-consumer/target.json
      - name: Reject unknown readiness
        id: blocked
        continue-on-error: true
        uses: ./
        with:
          mode: gate
          model: ${{ runner.temp }}/exacly-consumer/model
          policy: ${{ runner.temp }}/exacly-consumer/blocked-policy.yaml
          target: ${{ runner.temp }}/exacly-consumer/target.json
      - name: Verify that unknown readiness blocked the job
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.blocked.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          grep -F "Result: unknown" "$RUNNER_TEMP/exacly-gate.txt"

      - name: Observe mixed passing and skipped consumer tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --project "$GITHUB_WORKSPACE" --no-dev --no-sync python - "$RUNNER_TEMP/exacly-consumer/model/billing.yaml" <<'PY'
          import sys
          from pathlib import Path
          import yaml
          path = Path(sys.argv[1])
          document = yaml.safe_load(path.read_text())
          requirement = next(r for r in document["records"] if r["id"] == "REQ-001")
          requirement["observe"]["tests"] = {"cases": ["billing::first", "billing::second"]}
          path.write_text(yaml.safe_dump(document))
          PY
          uv run --project "$GITHUB_WORKSPACE" --no-dev --no-sync exacly refresh \
            "$RUNNER_TEMP/exacly-consumer/model" --context ci \
            --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --state "$RUNNER_TEMP/exacly-consumer/model/verification.json" \
            --junit tests/mixed-execution.xml
      - name: Reject incomplete verification
        id: incomplete
        continue-on-error: true
        uses: ./
        with:
          mode: gate
          model: ${{ runner.temp }}/exacly-consumer/model
          policy: ${{ runner.temp }}/exacly-consumer/policy.yaml
          target: ${{ runner.temp }}/exacly-consumer/target.json
      - name: Verify that mixed execution blocked the job
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.incomplete.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          grep -F "Result: unknown" "$RUNNER_TEMP/exacly-gate.txt"
          grep -F "inconclusive" "$RUNNER_TEMP/exacly-gate.txt"

  plan:
    # The plan for this repository's test model, commented on pull requests from this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: exacly-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          mode: plan
          model: tests/model tests/verification.json
