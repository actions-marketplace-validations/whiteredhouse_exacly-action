name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Test, lint and type-check
        run: mise run check

  action:
    # The whole action, uv setup included, as another repository runs it, on each runner OS it supports.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare a separate consumer model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exacly-consumer"
          cp -R tests/model "$RUNNER_TEMP/exacly-consumer/model"
          printf 'exacly: 0.2.0\nrecords: [{id: OUT-001}]\n' > "$RUNNER_TEMP/exacly-consumer/invalid.yaml"
      - name: Validate the consumer model
        uses: ./
        with:
          model: ${{ runner.temp }}/exacly-consumer/model
      - name: Reject an invalid consumer model
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          model: ${{ runner.temp }}/exacly-consumer/invalid.yaml
      - name: Verify that invalid input failed
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          grep -F "Result: does not conform" "$RUNNER_TEMP/exacly-report.txt"

  plan:
    # The plan for this repository's test model, commented on pull requests from this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: exacly-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          mode: plan
          model: tests/model
