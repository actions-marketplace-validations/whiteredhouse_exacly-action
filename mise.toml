# Tools and tasks for working on this repository. Run `mise run check` before pushing; CI runs the same.

[tools]
python = "3.12"
uv = "0.11.32"
shellcheck = "0.11.0"

[tasks.sync]
description = "Install exacly and development tools into .venv from uv.lock"
run = "uv sync --locked"

[tasks.test]
description = "Run the action's scripts on a model in a temporary repository"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks.lint]
description = "Check Python style and formatting with Ruff, and the scripts with ShellCheck"
depends = ["sync"]
run = ["uv run --locked ruff check", "uv run --locked ruff format --check", "shellcheck scripts/*.sh"]

[tasks.typecheck]
description = "Type-check the tests with mypy"
depends = ["sync"]
run = "uv run --locked mypy"

[tasks.check]
description = "Everything CI runs"
depends = ["test", "lint", "typecheck"]
